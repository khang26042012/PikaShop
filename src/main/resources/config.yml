# PikaShop 0.1.0 - khung MVP (R6). Giá trị thật sẽ cân lại trước khi live.
# level-prices: mốc tổng $ đã bán trong 1 category để lên multiplier level.
level-prices: [25000, 150000, 500000, 1000000, 5000000, 25000000]
# base-bonus mỗi level (cộng thêm vào base-multiplier của category).
level-bonus-per-level: 0.05
shards:
  kill-enabled: true
  kill-base: 15
  kill-extra-ten: 10
  kill-extra-twenty: 20
  kill-cooldown-seconds: 300
  afk-enabled: true
  afk-per-interval: 10
  afk-interval-seconds: 60
  afk-radius: 10.0
  afk-countdown-seconds: 5
